# 说明：services.gradle.org 的重定向目标证书在本机 JVM 信任链下校验失败（PKIX path building failed），
# 因此指向国内镜像。如需官方源，可改回：
#   https\://services.gradle.org/distributions/gradle-8.12-bin.zip
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.12-bin.zip
networkTimeout=10000
validateDistributionUrl=false
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
