# ===== 离线编译 classpath（本机 NeoForge 产物）=====
# maven.neoforged.net 在本机不可达（DNS 污染 + 真实 CDN IP 被封），而 MDG 的
# createMinecraftArtifacts 必须联网拉取 net.neoforged:neoform-runtime（该构件只发布在
# maven.neoforged.net，常见国内镜像均不含）。因此改为直接使用启动器已落地的 NeoForge 产物：
#   neoforge-<ver>-client.jar     打补丁的 MC（官方名）
#   client-<mcver>-<neoform>-srg.jar  完整 MC（官方名）
#   neoforge-<ver>-universal.jar  NeoForge API
# 以及整合包 profile JSON 里列出的运行期依赖。版本号从 profile 的 --fml.* 参数自动读取。
tianfu.minecraftDir=D:/game/mcmod/1/.minecraft
